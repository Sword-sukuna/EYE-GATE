<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  />

  <title>
    EYE GATE • Login
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./css/global.css"
  />

  <link
    rel="stylesheet"
    href="./css/login.css"
  />

  <link
    rel="stylesheet"
    href="./css/toast.css"
  />

</head>

<body>


<!-- ========================= -->
<!-- 🌌 BACKGROUND -->
<!-- ========================= -->
<div class="background">

  <div class="glow glow-one"></div>

  <div class="glow glow-two"></div>

  <div class="grid"></div>

</div>



<!-- ========================= -->
<!-- 🔐 LOGIN -->
<!-- ========================= -->
<main class="login-container">

  <div class="login-card">


    <!-- logo -->
    <div class="login-logo">

      <div class="eye-logo">
        👁
      </div>

      <h1>
        EYE GATE
      </h1>

      <p>
        Acesse o sistema escolar
      </p>

    </div>



    <!-- formulário -->
    <form id="loginForm">


      <!-- email -->
      <div class="input-group">

        <label>
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="
            Digite seu email
          "
        />

      </div>



      <!-- senha -->
      <div class="input-group">

        <label>
          Senha
        </label>

        <input
          type="password"
          id="senha"
          placeholder="
            Digite sua senha
          "
        />

      </div>



      <!-- lembrar -->
      <div class="remember-box">

        <label>

          <input
            type="checkbox"
          />

          Lembrar acesso

        </label>

        <a href="#">

          Esqueci a senha

        </a>

      </div>



      <!-- botão -->
      <button
        type="submit"
        class="login-btn"
      >

        Entrar no Sistema

      </button>

    </form>



    <!-- criar conta -->
    <div class="register-link">

      <p>

        Não possui conta?

        <a href="./registro.html">

          Criar conta

        </a>

      </p>

    </div>

  </div>

</main>



<!-- ========================= -->
<!-- 📦 SCRIPT -->
<!-- ========================= -->
<script src="./js/login.js"></script>

</body>
</html>
