<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  />

  <title>
    EYE GATE • Cadastro
  </title>

  <link
    rel="stylesheet"
    href="./css/cadastro.css"
  />

  <link
  rel="stylesheet"
  href="./css/toast.css"
/>

</head>

<body>


<!-- ========================= -->
<!-- 🌌 BG -->
<!-- ========================= -->
<div class="bg"></div>



<!-- ========================= -->
<!-- 📱 SIDEBAR -->
<!-- ========================= -->
<aside class="sidebar">

  <div>

    <!-- logo -->
    <div class="logo-area">

      <div class="logo-circle">
        👁
      </div>

      <div>

        <h1>
          EYE GATE
        </h1>

        <p>
          Smart School Security
        </p>

      </div>

    </div>



    <!-- menu -->
    <nav class="menu">

      <a
        href="./dashboard.html"
        class="menu-item"
      >
        📊 Dashboard
      </a>

      <a
        href="./cadastro.html"
        class="menu-item active"
      >
        👤 Cadastro
      </a>

      <a
        href="#"
        class="menu-item"
      >
        📋 Registros
      </a>

      <a
        href="#"
        class="menu-item"
      >
        👀 Monitor
      </a>

      <a
        href="#"
        class="menu-item"
      >
        ⚙ Configurações
      </a>

    </nav>

  </div>



  <!-- logout -->
  <button
    class="logout-btn"
    onclick="logout()"
  >

    Sair

  </button>

</aside>



<!-- ========================= -->
<!-- 📄 MAIN -->
<!-- ========================= -->
<main class="main-content">


  <!-- topo -->
  <section class="topbar">

    <div>

      <h2>
        Cadastro Facial
      </h2>

      <p>
        Registrar novos alunos
      </p>

    </div>

  </section>



  <!-- ===================== -->
  <!-- 👤 FORM -->
  <!-- ===================== -->
  <section class="form-card">

    <div class="form-left">

      <h3>
        👤 Dados do aluno
      </h3>


      <div class="input-group">

        <label>
          Nome Completo
        </label>

        <input
          type="text"
          id="nome"
          placeholder="
            Digite o nome
          "
        />

      </div>


      <div class="input-group">

        <label>
          Matrícula
        </label>

        <input
          type="text"
          id="matricula"
          placeholder="
            EX: 2026001
          "
        />

      </div>


      <div class="input-group">

        <label>
          Turma
        </label>

        <input
          type="text"
          id="turma"
          placeholder="
            EX: 2º Ano B
          "
        />

      </div>


      <button
        class="capture-btn"
        onclick="capturarAluno()"
      >

        📸 Capturar Face

      </button>

    </div>



    <!-- câmera -->
    <div class="form-right">

      <div class="camera-box">

        <video
          id="video"
          autoplay
          playsinline
          muted
        ></video>


        <div class="camera-overlay">

          <div class="scan-line"></div>

          <div class="face-frame"></div>

        </div>

      </div>


      <div
        class="camera-status"
        id="status"
      >

        🔎 Aguardando captura...

      </div>

    </div>

  </section>



  <!-- ===================== -->
  <!-- 👥 LISTA -->
  <!-- ===================== -->
  <section class="students-section">

    <div class="section-header">

      <h3>
        👥 Alunos Cadastrados
      </h3>

      <button
        class="refresh-btn"
        onclick="carregarAlunos()"
      >

        Atualizar

      </button>

    </div>


    <div
      class="students-grid"
      id="studentsGrid"
    ></div>

  </section>

</main>



<!-- ========================= -->
<!-- 📦 SCRIPT -->
<!-- ========================= -->
<script src="./js/cadastro.js"></script>

</body>
</html>
