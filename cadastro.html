<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  />

  <title>
    EYE GATE • Cadastro Facial
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./css/global.css"
  />

  <link
    rel="stylesheet"
    href="./css/dashboard.css"
  />

  <link
    rel="stylesheet"
    href="./css/cadastro.css"
  />

</head>

<body>


<!-- ========================= -->
<!-- 🌌 BG -->
<!-- ========================= -->
<div class="background">

  <div class="glow glow-one"></div>

  <div class="glow glow-two"></div>

  <div class="grid"></div>

</div>



<!-- ========================= -->
<!-- 📱 APP -->
<!-- ========================= -->
<div class="dashboard-layout">


  <!-- ===================== -->
  <!-- 📚 SIDEBAR -->
  <!-- ===================== -->
  <aside class="sidebar">

    <div class="sidebar-logo">

      <div class="eye-logo">
        👁
      </div>

      <div>

        <h2>
          EYE GATE
        </h2>

        <p>
          Painel Escolar
        </p>

      </div>

    </div>



    <nav class="menu">

      <a
        href="./dashboard.html"
        class="menu-item"
      >

        🏠 Dashboard

      </a>


      <a
        href="./cadastro.html"
        class="menu-item active"
      >

        👤 Cadastro Facial

      </a>


      <a
        href="./monitor.html"
        class="menu-item"
      >

        👀 Monitoramento

      </a>


      <a
        href="./registros.html"
        class="menu-item"
      >

        🕒 Registros

      </a>


      <a
        href="./configuracoes.html"
        class="menu-item"
      >

        ⚙ Configurações

      </a>

    </nav>



    <div class="sidebar-footer">

      <button
        class="logout-btn"
        onclick="logout()"
      >

        🚪 Sair

      </button>

    </div>

  </aside>




  <!-- ===================== -->
  <!-- 📋 CONTENT -->
  <!-- ===================== -->
  <main class="dashboard-content">


    <!-- topo -->
    <header class="topbar">

      <div>

        <h1>
          Cadastro Facial
        </h1>

        <p>
          Registrar novos alunos
        </p>

      </div>

    </header>



    <!-- cadastro -->
    <section class="cadastro-grid">


      <!-- câmera -->
      <div class="camera-card">

        <div class="camera-header">

          <h2>
            📷 Câmera Facial
          </h2>

        </div>


        <div class="camera-box">

          <video
            id="video"
            autoplay
            muted
            playsinline
          ></video>


          <div class="camera-overlay">

            <div class="face-frame"></div>

            <div class="scan-line"></div>

          </div>

        </div>

      </div>



      <!-- formulário -->
      <div class="form-card">

        <h2>
          👤 Dados do Aluno
        </h2>


        <div class="input-group">

          <label>
            Nome Completo
          </label>

          <input
            type="text"
            id="nome"
            placeholder="
              Digite o nome
            "
          />

        </div>



        <div class="input-group">

          <label>
            Matrícula
          </label>

          <input
            type="text"
            id="matricula"
            placeholder="
              Número da matrícula
            "
          />

        </div>



        <div class="input-group">

          <label>
            Turma
          </label>

          <input
            type="text"
            id="turma"
            placeholder="
              Ex: 2ºA
            "
          />

        </div>



        <button
          class="cadastro-btn"
        >

          📸 Capturar Face

        </button>

      </div>

    </section>




    <!-- lista -->
    <section class="alunos-section">

      <div class="section-title">

        <h2>
          👥 Alunos Registrados
        </h2>

      </div>


      <div class="alunos-list">


        <div class="aluno-item">

          <div class="aluno-info">

            <div class="aluno-avatar">
              👤
            </div>

            <div>

              <strong>
                Nenhum aluno registrado
              </strong>

              <p>
                O sistema iniciará vazio
              </p>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>



<!-- SCRIPTS -->
<script src="./js/dashboard.js"></script>

<script src="./js/cadastro.js"></script>

</body>
</html>
