<!-- 🔐 LOGIN -->
<!-- ========================= -->
<section
  id="loginPage"
  class="page active-page"
>

  <main class="login-container">

    <div class="login-card">

      <div class="login-logo">

        <div class="eye-logo">
          👁
        </div>

        <h1>EYE GATE</h1>

        <p>
          Sistema Inteligente Escolar
        </p>

      </div>


      <form id="loginForm">

        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="Digite seu email"
            required
          />

        </div>


        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
          />

        </div>


        <button
          type="submit"
          class="login-btn"
        >
          Entrar
        </button>

      </form>


      <div class="register-link">

        <p>

          Não possui conta?

          <a
            href="#"
            onclick="abrirPagina('registroPage')"
          >
            Criar conta
          </a>

        </p>

      </div>


      <div
        class="register-link"
        style="margin-top:10px;"
      >

        <a
          href="#"
          onclick="abrirPagina('adminLoginPage')"
        >
          🔐 Entrar como ADM
        </a>

      </div>

    </div>

  </main>

</section>
