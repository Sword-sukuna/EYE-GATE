<!-- 📝 REGISTRO -->
<!-- ========================= -->
<section
  id="registroPage"
  class="page"
>

  <main class="login-container">

    <div class="login-card">

      <div class="eye-logo">
        👁
      </div>

      <h1>EYE GATE</h1>

      <p>
        Criar nova conta
      </p>


      <form id="registroForm">

        <div class="input-group">

          <label>Nome</label>

          <input
            type="text"
            id="registroNome"
            required
          />

        </div>


        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            id="registroEmail"
            required
          />

        </div>


        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="registroSenha"
            required
          />

        </div>


        <button
          type="submit"
          class="login-btn"
        >
          Criar Conta
        </button>

      </form>


      <div class="register-link">

        <a
          href="#"
          onclick="abrirPagina('loginPage')"
        >
          ← Voltar
        </a>

      </div>

    </div>

  </main>

</section>
