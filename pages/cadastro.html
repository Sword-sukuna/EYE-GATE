<section id="cadastroPage" class="page">
  <div class="page-content">
    <div class="topbar">
      <h1>👤 Cadastro de Aluno</h1>
      <p class="subtitle">Captura Facial - 5 Posições</p>
    </div>

    <div class="form-card" style="max-width: 680px; margin: 0 auto;">
      <div class="input-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: João Silva Santos" />
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
        <div class="input-group">
          <label>Matrícula</label>
          <input type="text" id="matricula" placeholder="000000" />
        </div>
        <div class="input-group">
          <label>Turma</label>
          <input type="text" id="turma" placeholder="3º Ano A" />
        </div>
      </div>

      <!-- Camera -->
      <div class="camera-box" style="margin: 30px 0;">
        <video id="video" autoplay muted playsinline></video>
      </div>

      <div id="instrucaoFace" class="face-guide">Olhe para frente 👀</div>

      <div class="progress-box">
        <div id="faceProgress" class="progress-fill"></div>
      </div>

      <button class="login-btn" onclick="capturarFace()" style="width:100%; margin:15px 0;">
        👁 Capturar Pose Atual
      </button>

      <button class="cadastro-btn login-btn" style="width:100%;">
        <i data-lucide="user-plus"></i> Finalizar Cadastro
      </button>

      <button class="logout-btn" onclick="abrirPagina('dashboardPage')" style="margin-top:15px; width:100%;">
        ← Voltar ao Dashboard
      </button>
    </div>
  </div>
</section>
