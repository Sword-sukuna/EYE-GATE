<!-- ========================= -->
<!-- 👤 CADASTRO -->
<!-- ========================= -->
<section
  id="cadastroPage"
  class="page"
>

  <div class="page-content">

    <div class="topbar">

      <h1>
        Cadastro Facial
      </h1>

    </div>


    <div class="form-card">

      <h2>
        👤 Novo Aluno
      </h2>


      <div class="input-group">

        <label>Nome</label>

        <input
          type="text"
          id="nome"
          placeholder="Nome do aluno"
        />

      </div>


      <div class="input-group">

        <label>Matrícula</label>

        <input
          type="text"
          id="matricula"
          placeholder="Matrícula"
        />

      </div>


      <div class="input-group">

        <label>Turma</label>

        <input
          type="text"
          id="turma"
          placeholder="Turma"
        />

      </div>

      <!-- CAMERA -->
<div class="camera-box">

  <video
    id="video"
    autoplay
    muted
    playsinline
    width="100%"
  ></video>

</div>

<div id="instrucaoFace" class="face-guide">
  Olhe para frente 👀
</div>

<div class="progress-box">

  <div
    id="faceProgress"
    class="progress-fill">
  </div>

</div>

<button
  class="login-btn"
  onclick="capturarFace()"
  style="margin-bottom:15px;"
>

  👁 Capturar Face

</button>

      <button
  class="cadastro-btn login-btn"
>
  <i data-lucide="user-plus"></i>
Cadastro
</button>


      <button
        class="logout-btn"
        onclick="abrirPagina('dashboardPage')"
        style="margin-top:15px;"
      >
        ← Voltar

      </button>

    </div>

  </div>

</section>
