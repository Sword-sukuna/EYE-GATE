<!-- 👀 MONITOR (COMPLETO E MELHORADO) -->
<!-- ========================= -->
<section id="monitorPage" class="page">

  <div class="page-content">

    <div class="topbar">
      <h1>🎥 Monitoramento em Tempo Real</h1>
      <p class="subtitle">Sistema de Reconhecimento Facial</p>
    </div>

    <div class="activity-section">

      <!-- Seleção de Câmera -->
      <div class="camera-selector">
        <label><strong>Câmera Atual:</strong></label>
        <select id="cameraSelect" onchange="selecionarCamera(this.value)" class="camera-select">
          <!-- Opções carregadas via JS -->
        </select>
        <button onclick="cadastrarCamera()" class="add-camera-btn">+ Nova Câmera</button>
      </div>

      <!-- Área do Vídeo -->
      <div class="camera-box">
        <video id="monitorVideo" autoplay muted playsinline></video>
        
        <!-- Overlay de Status -->
        <div class="status-overlay">
          <h3 id="statusTitulo">Aguardando detecção...</h3>
          <p id="statusTexto">Posicione o rosto na câmera</p>
        </div>
      </div>

      <!-- Info -->
      <div class="monitor-info">
        <div class="info-card">
          <span>Alunos Reconhecidos Hoje</span>
          <strong id="alunosHoje">0</strong>
        </div>
        <button onclick="pararMonitor()" class="stop-btn">⏹ Parar Monitor</button>
      </div>

      <!-- Logs recentes -->
      <div class="logs-list">
        <h3>Últimos Reconhecimentos</h3>
        <!-- Logs serão carregados via JS -->
      </div>

    </div>

    <button class="logout-btn" onclick="abrirPagina('dashboardPage')">
      ← Voltar ao Dashboard
    </button>

  </div>

</section>
