<!-- 🔐 ADMIN LOGIN -->
<!-- ========================= -->
<section
  id="adminLoginPage"
  class="page"
>

  <main class="login-container">

    <div class="login-card">

      <div class="eye-logo">
        🔐
      </div>

      <h1>ADMIN</h1>

      <p>
        Acesso Restrito
      </p>


      <form id="adminForm">

        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            id="adminEmail"
            required
          />

        </div>


        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            id="adminSenha"
            required
          />

        </div>


        <button
          type="submit"
          class="login-btn"
        >
          Entrar como ADM
        </button>

      </form>


      <div class="register-link">

        <a
          href="#"
          onclick="abrirPagina('loginPage')"
        >
          ← Voltar
        </a>

      </div>

    </div>

  </main>

</section>
