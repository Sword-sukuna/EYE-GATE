<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>EYE GATE • Dashboard</title>

  <link rel="stylesheet" href="./css/global.css"/>
  <link rel="stylesheet" href="./css/dashboard.css"/>

</head>

<body>


<div class="background">
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>
  <div class="grid"></div>
</div>



<div class="dashboard-layout">


  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-logo">
      <div class="eye-logo">👁</div>

      <div>
        <h2>EYE GATE</h2>
        <p>Painel Escolar</p>
      </div>
    </div>


    <nav class="menu">

      <a href="./dashboard.html" class="menu-item active">🏠 Dashboard</a>
      <a href="./cadastro.html" class="menu-item">👤 Cadastro Facial</a>
      <a href="./monitor.html" class="menu-item">👀 Monitoramento</a>
      <a href="./registros.html" class="menu-item">🕒 Registros</a>
      <a href="./configuracoes.html" class="menu-item">⚙ Configurações</a>

    </nav>


    <!-- 🔐 ADMIN PANEL (oculto por padrão) -->
    <div id="adminPanel" class="admin-panel" style="display:none;">

      <h3>🔐 ADMIN</h3>

      <button onclick="listarUsuarios()">👥 Ver usuários</button>
      <button onclick="abrirGerenciador()">🗑 Gerenciar contas</button>
      <button onclick="resetSistema()">⚠ Reset sistema</button>

    </div>


    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">🚪 Sair</button>
    </div>

  </aside>




  <!-- CONTENT -->
  <main class="dashboard-content">


    <!-- TOP -->
    <header class="topbar">

      <div>
        <h1>Dashboard</h1>
        <p>Controle inteligente escolar</p>
      </div>


      <!-- 👤 USER DINÂMICO -->
      <div class="top-user">

        <div class="user-avatar">👤</div>

        <div>
          <strong id="userName">Carregando...</strong>
          <p id="userType">...</p>
        </div>

      </div>

    </header>



    <!-- CARDS -->
    <section class="stats-grid">

      <div class="stat-card">
        <span>👥</span>
        <h2 id="totalUsers">0</h2>
        <p>Alunos Registrados</p>
      </div>

      <div class="stat-card">
        <span>📡</span>
        <h2>Online</h2>
        <p>Sistema Operacional</p>
      </div>

    </section>




    <!-- ATIVIDADE -->
    <section class="activity-section">

      <div class="section-title">
        <h2>📋 Atividade Recente</h2>
      </div>

      <div class="activity-list">

        <div class="activity-item">
          <div>
            <strong>Sistema iniciado</strong>
            <p>Dashboard carregado</p>
          </div>
          <span>Agora</span>
        </div>

      </div>

    </section>

  </main>

</div>



<script src="./js/dashboard.js"></script>

</body>
</html>
