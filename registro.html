<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    EYE GATE • Criar Conta
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./css/global.css"
  />

  <link
    rel="stylesheet"
    href="./css/login.css"
  />

  <link
    rel="stylesheet"
    href="./css/registro.css"
  />

</head>

<body>


<!-- ========================= -->
<!-- 🌌 BACKGROUND -->
<!-- ========================= -->
<div class="background">

  <div class="glow glow-one"></div>

  <div class="glow glow-two"></div>

  <div class="grid"></div>

</div>



<!-- ========================= -->
<!-- 📦 CONTAINER -->
<!-- ========================= -->
<div class="login-container">


  <!-- ===================== -->
  <!-- 🧠 CARD -->
  <!-- ===================== -->
  <div class="login-card">


    <!-- logo -->
    <div class="logo">

      👁

    </div>


    <h1>
      EYE GATE
    </h1>


    <p>
      Criar nova conta
    </p>



    <!-- ===================== -->
    <!-- FORM -->
    <!-- ===================== -->
    <form id="registroForm">


      <label>
        Nome completo
      </label>

      <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
        required
      />



      <label>
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu email"
        required
      />



      <label>
        Senha
      </label>

      <input
        type="password"
        id="senha"
        placeholder="Crie uma senha"
        required
      />



      <label>
        Confirmar senha
      </label>

      <input
        type="password"
        id="confirmarSenha"
        placeholder="Confirme sua senha"
        required
      />



      <!-- BOTÃO -->
      <button
        type="submit"
        class="login-btn"
      >

        Criar Conta

      </button>



      <!-- LINK LOGIN -->
      <div class="extra">

        Já tem conta?

        <a href="./login.html">

          Entrar

        </a>

      </div>


    </form>

  </div>

</div>



<!-- ========================= -->
<!-- JS -->
<!-- ========================= -->
<script src="./js/registro.js"></script>

</body>
</html>
