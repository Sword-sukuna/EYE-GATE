<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  >

  <title>
    EYE GATE • Login
  </title>


  <!-- css -->
  <link
    rel="stylesheet"
    href="./assets/css/login.css"
  >

  <link
  rel="stylesheet"
  href="./css/toast.css"
/>

</head>

<body>


<!-- ========================= -->
<!-- 🌌 BACKGROUND -->
<!-- ========================= -->
<div class="background">

  <div class="glow one"></div>

  <div class="glow two"></div>

</div>



<!-- ========================= -->
<!-- 🔐 LOGIN -->
<!-- ========================= -->
<div class="login-container">


  <div class="login-card">


    <!-- ===================== -->
    <!-- 👁 LOGO -->
    <!-- ===================== -->
    <div class="logo-area">

      <div class="logo-circle">
        👁
      </div>

      <h1>
        EYE GATE
      </h1>

      <p>
        Sistema Inteligente
        de Controle Escolar
      </p>

    </div>



    <!-- ===================== -->
    <!-- 📝 FORM -->
    <!-- ===================== -->
    <form id="loginForm">


      <!-- email -->
      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="
            Digite seu email
          "
        >

      </div>



      <!-- senha -->
      <div class="form-group">

        <label>
          Senha
        </label>

        <input
          type="password"
          id="password"
          placeholder="
            Digite sua senha
          "
        >

      </div>



      <!-- botão -->
      <button
        type="submit"
        class="login-btn"
      >

        Entrar no Sistema

      </button>


      <!-- erro -->
      <p id="errorMessage"></p>

    </form>

  </div>

</div>



<!-- ========================= -->
<!-- 📦 SCRIPT -->
<!-- ========================= -->
<script src="./assets/js/login.js"></script>

</body>
</html>
