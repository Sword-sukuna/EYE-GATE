<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  />

  <title>
    EYE GATE • Monitor
  </title>

  <link
    rel="stylesheet"
    href="./css/monitor.css"
  />

</head>

<body>


<!-- ========================= -->
<!-- 🌌 BG -->
<!-- ========================= -->
<div class="bg"></div>



<!-- ========================= -->
<!-- 📱 SIDEBAR -->
<!-- ========================= -->
<aside class="sidebar">

  <div>

    <!-- logo -->
    <div class="logo-area">

      <div class="logo-circle">
        👁
      </div>

      <div>

        <h1>
          EYE GATE
        </h1>

        <p>
          Smart School Security
        </p>

      </div>

    </div>



    <!-- menu -->
    <nav class="menu">

      <a
        href="./dashboard.html"
        class="menu-item"
      >
        📊 Dashboard
      </a>

      <a
        href="./cadastro.html"
        class="menu-item"
      >
        👤 Cadastro
      </a>

      <a
        href="./registros.html"
        class="menu-item"
      >
        📋 Registros
      </a>

      <a
        href="./monitor.html"
        class="menu-item active"
      >
        👀 Monitor
      </a>

      <a
        href="#"
        class="menu-item"
      >
        ⚙ Configurações
      </a>

    </nav>

  </div>



  <!-- logout -->
  <button
    class="logout-btn"
    onclick="logout()"
  >

    Sair

  </button>

</aside>



<!-- ========================= -->
<!-- 📄 MAIN -->
<!-- ========================= -->
<main class="main-content">


  <!-- ===================== -->
  <!-- 🔝 TOPO -->
  <!-- ===================== -->
  <section class="topbar">

    <div>

      <h2>
        Monitor em Tempo Real
      </h2>

      <p>
        Reconhecimento facial ativo
      </p>

    </div>


    <div class="live-status">

      <span class="pulse"></span>

      Sistema Online

    </div>

  </section>



  <!-- ===================== -->
  <!-- 📷 CAMERA -->
  <!-- ===================== -->
  <section class="camera-section">

    <div class="camera-card">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <!-- overlay -->
      <div class="camera-overlay">

        <div class="scan-line"></div>

        <div class="face-frame"></div>

      </div>

    </div>



    <!-- status -->
    <div class="recognition-card">

      <h3>
        📡 Status do Reconhecimento
      </h3>

      <div
        class="recognition-status"
        id="recognitionStatus"
      >

        🔎 Aguardando rosto...

      </div>



      <!-- aluno -->
      <div class="student-detected">

        <div class="student-avatar">
          👤
        </div>

        <div>

          <h4 id="studentName">
            Nenhum aluno
          </h4>

          <p id="studentInfo">
            Aguardando reconhecimento
          </p>

        </div>

      </div>

    </div>

  </section>



  <!-- ===================== -->
  <!-- 📋 LOGS -->
  <!-- ===================== -->
  <section class="logs-card">

    <div class="logs-header">

      <h3>
        📋 Últimos Registros
      </h3>

      <button
        class="refresh-btn"
        onclick="carregarLogs()"
      >

        Atualizar

      </button>

    </div>


    <div
      class="logs-list"
      id="logsList"
    ></div>

  </section>

</main>



<!-- ========================= -->
<!-- 📦 SCRIPT -->
<!-- ========================= -->
<script src="./js/monitor.js"></script>

</body>
</html>
